[package]
name = "quant_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15.7"
anyhow = "1.0.104"
rusqlite = { version = "0.40.1", features = ["bundled"] }
