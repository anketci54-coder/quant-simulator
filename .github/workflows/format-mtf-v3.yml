name: Format MTF V3
on:
  push:
    branches: [agent/multi-timeframe-strategy-v3]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-timeframe-strategy-v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git diff --cached --quiet || git commit -m 'style: format MTF v3 source'
          git push origin HEAD:agent/multi-timeframe-strategy-v3