name: Capture V4 Clippy
on:
  push:
    branches: [agent/mtf-v4-mass-market]
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mtf-v4-mass-market
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings > v4-clippy.log 2>&1 || true
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v4-clippy.log
          git commit -m 'chore: capture V4 clippy diagnostics'
          git push origin HEAD:agent/mtf-v4-mass-market