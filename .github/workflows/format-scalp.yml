name: Format Scalp Engine
on:
  push:
    branches: [agent/sideways-scalp-engine]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sideways-scalp-engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git diff --cached --quiet || git commit -m 'style: format scalp engine'
          git push origin HEAD:agent/sideways-scalp-engine